<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Services Section</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .travel-hero {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 540px;
      overflow: hidden;
      background-color: #111;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      filter: grayscale(100%) contrast(108%) brightness(92%);
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.85) 0%,
        rgba(0, 0, 0, 0.45) 38%,
        rgba(0, 0, 0, 0.05) 70%,
        transparent 100%
      );
      display: flex;
      align-items: flex-end;
      padding: 45px 50px;
    }

    .hero-content {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      color: #ffffff;
    }

    .hero-text {
      max-width: 390px;
    }

    .hero-text h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3.5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .hero-text p {
      font-family: 'Open Sans', sans-serif;
      font-size: 13px;
      line-height: 1.65;
      color: #e2e2e2;
      font-weight: 300;
    }

    .hero-features {
      display: flex;
      align-items: center;
      gap: 55px;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .feature-icon {
      width: 38px;
      height: 38px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .feature-item:hover .feature-icon {
      transform: translateY(-4px);
    }

    .feature-item span {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f0f0f0;
    }

    @media (max-width: 768px) {
      .travel-hero {
        height: auto;
        min-height: 520px;
      }

      .hero-overlay {
        padding: 30px 25px;
      }

      .hero-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }

      .hero-features {
        width: 100%;
        justify-content: space-between;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <section class="travel-hero">
    <img
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1400&q=80"
      alt="Smiling Woman Portrait"
      class="hero-bg"
    />

    <div class="hero-overlay">
      <div class="hero-content">

        <div class="hero-text">
          <h2>TRAVEL SERVICES</h2>
          <p>
            Find the best possible rental car rate. Compare rates worldwide and save up to 60% on deals from over 1,053 car rental companies.
          </p>
        </div>

        <div class="hero-features">

          <div class="feature-item">
            <svg viewBox="0 0 24 24" class="feature-icon" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M12 21s-6-5.686-6-10a6 6 0 1 1 12 0c0 4.314-6 10-6 10z" />
              <circle cx="12" cy="11" r="2.2" />
            </svg>
            <span>LOCATION</span>
          </div>

          <div class="feature-item">
            <svg viewBox="0 0 24 24" class="feature-icon" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
              <rect x="3" y="11" width="18" height="6" rx="2" />
              <circle cx="7.5" cy="14" r="1" />
              <circle cx="16.5" cy="14" r="1" />
              <path d="M5 17v2M19 17v2" />
            </svg>
            <span>250+ CARS</span>
          </div>

          <div class="feature-item">
            <svg viewBox="0 0 24 24" class="feature-icon" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="8" r="2.5" />
              <path d="M7.5 18c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5" />
              <circle cx="6.5" cy="10" r="1.8" />
              <path d="M3 18c0-1.8 1.5-3.2 3.3-3.2" />
              <circle cx="17.5" cy="10" r="1.8" />
              <path d="M21 18c0-1.8-1.5-3.2-3.3-3.2" />
            </svg>
            <span>HAPPY USERS</span>
          </div>

        </div>
      </div>
    </div>
  </section>

</body>
</html>
