
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #667eea, #764ba2);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #764ba2;
        }

        #successMessage {
            color: green;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form id="registrationForm">

            <div class="form-group">

                <label>Username</label>

                <input type="text" id="username"
                placeholder="Enter your username">

                <p class="error" id="usernameError"></p>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="text" id="email"
                placeholder="Enter your email">

                <p class="error" id="emailError"></p>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input type="password" id="password"
                placeholder="Enter your password">

                <p class="error" id="passwordError"></p>

            </div>

            <button type="submit">Register</button>

            <p id="successMessage"></p>

        </form>

    </div>


    <script>

        let username = document.getElementById("username");
        let email = document.getElementById("email");
        let password = document.getElementById("password");

        let usernameError = document.getElementById("usernameError");
        let emailError = document.getElementById("emailError");
        let passwordError = document.getElementById("passwordError");

        let successMessage = document.getElementById("successMessage");

        let form = document.getElementById("registrationForm");

        function validateUsername() {

            if (username.value.trim() === "") {

                usernameError.innerText = "Please enter username";
                username.style.borderColor = "red";

                return false;
            }

            else {

                usernameError.innerText = "";
                username.style.borderColor = "green";

                return true;
            }
        }

        function validateEmail() {

            if (email.value.trim() === "") {

                emailError.innerText = "Please enter email";
                email.style.borderColor = "red";

                return false;
            }

            else if (!email.value.includes("@") || !email.value.includes(".")) {

                emailError.innerText = "Please enter valid email";
                email.style.borderColor = "red";

                return false;
            }

            else {

                emailError.innerText = "";
                email.style.borderColor = "green";

                return true;
            }
        }

        function validatePassword() {

            if (password.value.trim() === "") {

                passwordError.innerText = "Please enter password";
                password.style.borderColor = "red";

                return false;
            }

            else if (password.value.length < 6) {

                passwordError.innerText = "Password must be at least 6 characters";
                password.style.borderColor = "red";

                return false;
            }

            else {

                passwordError.innerText = "";
                password.style.borderColor = "green";

                return true;
            }
        }


        username.addEventListener("input", validateUsername);

        email.addEventListener("input", validateEmail);

        password.addEventListener("input", validatePassword);


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            let userValid = validateUsername();
            let emailValid = validateEmail();
            let passwordValid = validatePassword();

            if (userValid && emailValid && passwordValid) {

                successMessage.innerText = "Registration Successful!";

                form.reset();

                username.style.borderColor = "#ccc";
                email.style.borderColor = "#ccc";
                password.style.borderColor = "#ccc";

            }

            else {

                successMessage.innerText = "";

            }

        });

    </script>

</body>
</html>
